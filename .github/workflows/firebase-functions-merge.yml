name: Deploy Functions and Firestore config on merge
on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase.json"
jobs:
  deploy_backend:
    name: Backend Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Block-routing rules are pure logic, so they run without the emulator.
      - name: Run function tests
        working-directory: functions
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g firebase-tools

      # The hosting action only deploys hosting, so the CLI is driven directly
      # with a service account. It needs Cloud Functions Admin, Service Account
      # User, Firebase Rules Admin and Secret Manager Secret Accessor.
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes \
            --project tldr-news-229ac \
            --non-interactive
